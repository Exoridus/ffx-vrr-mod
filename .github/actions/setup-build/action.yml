name: Setup build environment
description: .NET for mod builds; C++ and Windows debugging tools for source-built full packages.

inputs:
  full-build:
    description: Prepare native Fahrenheit host compilation.
    default: 'false'
  dotnet-version:
    description: .NET SDK version.
    default: '10.0.x'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      if: inputs.full-build == 'true'
    - name: Integrate vcpkg
      if: inputs.full-build == 'true'
      shell: cmd
      run: |
        if "%VCPKG_INSTALLATION_ROOT%"=="" exit /b 1
        call "%VCPKG_INSTALLATION_ROOT%\bootstrap-vcpkg.bat" -disableMetrics
        if errorlevel 1 exit /b %ERRORLEVEL%
        "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" integrate install
        if errorlevel 1 exit /b %ERRORLEVEL%
    - name: Ensure Windows debugging tools
      if: inputs.full-build == 'true'
      shell: pwsh
      run: |
        $debuggers = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86"
        if (-not (Test-Path "$debuggers\dbghelp.dll") -or -not (Test-Path "$debuggers\symsrv.dll")) {
          $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2382321' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Windows SDK installer signature is invalid.' }
          $process = Start-Process $installer -ArgumentList '/features', 'OptionId.WindowsDesktopDebuggers', '/quiet', '/norestart' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -notin 0, 3010) { throw "Windows SDK install failed: $($process.ExitCode)" }
        }
        if (-not (Test-Path "$debuggers\dbghelp.dll") -or -not (Test-Path "$debuggers\symsrv.dll")) { throw 'Windows SDK x86 Debugging Tools are missing.' }
