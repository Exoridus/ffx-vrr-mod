name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Verify Debug payload and tests
        if: matrix.configuration == 'Debug'
        shell: cmd
        run: build.cmd mod-verify --sdk local --configuration Debug
      - name: Build and verify mod-only development package
        if: matrix.configuration == 'Release'
        shell: cmd
        run: build.cmd mod-pack --sdk local --configuration Release --tag v0.0.0-ci --out-dir .release
      - name: Upload installable development packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-packages-${{ github.sha }}
          path: |
            .release/*.zip
            .release/*-source.tar.xz
            .release/*.sha256
            .release/*.provenance.json
            .release/release-notes.md
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
