name: Diag release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -i -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name=v0.1.0 -f name=diag -F draft=true -F prerelease=true 2>&1 | head -40
          echo "---- tag ref probe ----"
          gh api -i "repos/${{ github.repository }}/git/ref/tags/v0.1.0" 2>&1 | head -20
          echo "---- permissions ----"
          gh api "repos/${{ github.repository }}/actions/permissions/workflow"
