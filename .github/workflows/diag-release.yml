name: Diag release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release creation with an explicit target commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -i -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name=v0.1.0 -f name=diag -F draft=true -F prerelease=true \
            -f target_commitish=387df66848121cad932badf39412db876c9f4a6e 2>&1 | grep -E 'HTTP/|X-Accepted|message|errors|status' | head -20